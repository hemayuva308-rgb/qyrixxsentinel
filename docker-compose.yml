# Backend is NOT published to the host: only the frontend (which proxies server-side) is reachable.
# Network-level egress control (SG-01): the backend sits ONLY on "internal", a Docker network with no route to the
# outside world, so it cannot reach the internet at all. Real outbound tool execution (HttpAdapter) and Meta Llama
# calls require the explicit opt-in override:  docker compose -f docker-compose.yml -f docker-compose.egress.yml up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qyrix
      POSTGRES_DB: qyrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U qyrix -d qyrix"], interval: 3s, timeout: 3s, retries: 20 }
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]   # minimum the official entrypoint needs
    security_opt: ["no-new-privileges:true"]
    networks: [internal]                 # not published, no egress
  backend:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      QYRIX_DATABASE_URL: postgresql://qyrix:${POSTGRES_PASSWORD:?set in .env}@db:5432/qyrix
      QYRIX_TSA_URL: ${QYRIX_TSA_URL:-}
      QYRIX_TSA_CA_FILE: ${QYRIX_TSA_CA_FILE:-}
      QYRIX_ADMIN_TOKEN: ${QYRIX_ADMIN_TOKEN:?set in .env}
      QYRIX_AGENT_TOKEN: ${QYRIX_AGENT_TOKEN:?set in .env}
      QYRIX_APPROVED_DOMAINS: ${QYRIX_APPROVED_DOMAINS:-}
      QYRIX_ENABLE_DEMO_RESET: ${QYRIX_ENABLE_DEMO_RESET:-0}
      QYRIX_APPROVAL_TTL_SECONDS: ${QYRIX_APPROVAL_TTL_SECONDS:-900}
      QYRIX_GRANT_TTL_SECONDS: ${QYRIX_GRANT_TTL_SECONDS:-120}
      QYRIX_PUBLIC_DEMO: ${QYRIX_PUBLIC_DEMO:-1}
      QYRIX_DEMO_RATE_PER_MIN: ${QYRIX_DEMO_RATE_PER_MIN:-20}
      QYRIX_DEMO_GLOBAL_RATE_PER_MIN: ${QYRIX_DEMO_GLOBAL_RATE_PER_MIN:-600}
      META_API_KEY: ${META_API_KEY:-}
      META_MODEL: ${META_MODEL:-}
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      BASETEN_MODEL: ${BASETEN_MODEL:-}
    volumes: ["chain:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    environment:
      BACKEND_URL: http://backend:8000
      QYRIX_COOKIE_SECURE: ${QYRIX_COOKIE_SECURE:-0}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal, edge]          # "edge" exists only so the published port works; the API stays internal
networks:
  internal: { internal: true }          # no egress
  edge: {}
volumes: { chain: {}, pgdata: {} }
